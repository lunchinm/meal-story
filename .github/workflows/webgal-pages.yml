name: 构建并发布 WebGAL 版

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgal-pages
  cancel-in-progress: true

env:
  WEBGAL_TAG: 4.6.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 取出 WebGAL 源码
        uses: actions/checkout@v4
        with:
          repository: OpenWebGAL/WebGAL
          ref: ${{ env.WEBGAL_TAG }}
          path: .webgal-src

      - name: 准备 Node 与 yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable

      - name: 关闭编辑器同步
        working-directory: .webgal-src
        run: |
          sed -i 's/^\(\s*\)startPreviewSyncRuntime()/\1\/\/ startPreviewSyncRuntime()/' packages/webgal/src/Core/initializeScript.ts
          grep -n "startPreviewSyncRuntime" packages/webgal/src/Core/initializeScript.ts || true

      - name: 引擎补丁（打字机归零 / 回标题 API / 关面板 API）
        run: python3 .github/patch-engine.py .webgal-src/packages/webgal/src

      - name: 安装依赖
        working-directory: .webgal-src
        run: yarn install --frozen-lockfile

      - name: 构建解析器
        working-directory: .webgal-src
        run: yarn parser:build

      - name: 替换 game 目录
        run: |
          SRC=.webgal-src/packages/webgal/public/game
          rm -rf "$SRC/scene" "$SRC/background" "$SRC/figure" "$SRC/bgm" "$SRC/vocal"
          mkdir -p "$SRC"/{background,figure,bgm,vocal,scene}
          cp assets/bg/*.webp "$SRC"/background/
          cp assets/ch/*.webp "$SRC"/figure/
          cp assets/sfx/*.mp3 "$SRC"/bgm/
          cp assets/voice/*.mp3 "$SRC"/vocal/
          cp webgal-game/scene/*.txt "$SRC"/scene/
          cp webgal-game/config.txt "$SRC"/config.txt
          cp webgal-game/userStyleSheet.css "$SRC"/userStyleSheet.css
          cp webgal-game/template/Stage/TextBox/textbox.scss "$SRC"/template/Stage/TextBox/
          cp webgal-game/template/Stage/Choose/choose.scss "$SRC"/template/Stage/Choose/
          cp webgal-game/template/UI/Title/title.scss "$SRC"/template/UI/Title/

      - name: 构建引擎
        working-directory: .webgal-src
        run: yarn webgal:build

      - name: 注入主题脚本
        run: |
          DIST=.webgal-src/packages/webgal/dist
          cp webgal-game/theme-inject.js "$DIST"/theme-inject.js
          python3 .github/inject_theme.py
          touch "$DIST"/.nojekyll

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .webgal-src/packages/webgal/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4