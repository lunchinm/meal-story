name: 构建并发布 WebGAL 版

# 从 WebGAL 源码构建干净引擎，把我们的 game 目录塞进去，产物直推 gh-pages 分支。
# 不用改仓库的 Pages 设置（仍走 branch 模式），随时可以退回单文件版本。

on:
  workflow_dispatch:   # 仅手动触发：确认构建可用后再考虑自动

permissions:
  contents: write

concurrency:
  group: webgal-pages
  cancel-in-progress: true

env:
  WEBGAL_TAG: 4.6.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 取出 WebGAL 源码
        uses: actions/checkout@v4
        with:
          repository: OpenWebGAL/WebGAL
          ref: ${{ env.WEBGAL_TAG }}
          path: .webgal-src

      - name: 准备 Node 与 yarn
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable

      - name: 安装依赖
        working-directory: .webgal-src
        run: yarn install --frozen-lockfile

      - name: 构建解析器
        working-directory: .webgal-src
        run: yarn parser:build

      - name: 替换 game 目录
        run: |
          SRC=.webgal-src/packages/webgal/public/game
          rm -rf "$SRC/scene" "$SRC/background" "$SRC/figure" "$SRC/bgm" "$SRC/vocal"
          mkdir -p "$SRC"/{background,figure,bgm,vocal,scene}
          cp assets/bg/*.webp "$SRC"/background/
          cp assets/ch/*.webp "$SRC"/figure/
          cp assets/sfx/*.mp3 "$SRC"/bgm/
          cp assets/voice/*.mp3 "$SRC"/vocal/
          cp webgal-game/scene/*.txt "$SRC"/scene/
          cp webgal-game/config.txt "$SRC"/config.txt
          echo "场景 $(ls "$SRC/scene" | wc -l) / 立绘 $(ls "$SRC/figure" | wc -l) / 配音 $(ls "$SRC/vocal" | wc -l)"

      - name: 构建引擎
        working-directory: .webgal-src
        run: yarn webgal:build

      - name: 推到 gh-pages
        working-directory: .webgal-src/packages/webgal/dist
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "deploy: WebGAL ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages